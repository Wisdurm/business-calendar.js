<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Hienoin kalenteri ikinä</title>
	</head>
	<body>
		<calendar-component></calendar-component>
	</body>
	<script>
		const squares = [];
		let title;
		let lastRow;
		let year = 2026;
		let month = 8 - 1;

		const weekmask = "1111100";
		const holidays = [];
		let startDate = "9999-99-99";
		let endDate = "0000-00-00";

		function daysInMonth(year, month) {
			return new Date(year, month, 0).getDate();
		}

		function dateValue(date) {
			let year, month, day;
			[year, month, day] = date.split("-").map((x) => parseInt(x));
			return year + (month*30) + day;
		}
		
		function reindeer() {
			const startDay = (new Date(year, month, 0)).getDay();
			const days = daysInMonth(year, month);
			title.textContent = `Kalenteri (${month+1}.${year})`;

			if (days + startDay <= 35) {
				lastRow.setAttribute("hidden", null);
			} else {
				lastRow.removeAttribute("hidden");
			}
			
			squares.forEach((div) => {
				// Day amount
				const id = parseInt(div.id);
				const day = id - startDay;
				if (day > days || day <= 0) {
					div.textContent = "";
					div.setAttribute("bgcolor", "#ffffff");
					return;
				} else {
					div.textContent = day;
				}
				// Is holiday
				const date = `${year}-${month}-${day}`;
				const weekday = (new Date(year, month, day-1)).getDay();
				if (date == startDate || date == endDate) {
					div.setAttribute("bgcolor", "#ffff00");
				} else if (holidays.includes(date) || weekmask[weekday] == '0') {
					div.setAttribute("bgcolor", "#ff0000");
				} else if (dateValue(date) > dateValue(startDate) && dateValue(date) < dateValue(endDate)) {
					div.setAttribute("bgcolor", "#bbbbbb");
				} else {
					div.setAttribute("bgcolor", "#ffffff");
				}
			});
		}

		class Calendar extends HTMLElement {
			constructor() {
				super();
				const shadowRoot = this.attachShadow({mode: 'open'});

				const cont = document.createElement("table");
				cont.setAttribute("bgcolor", "#000000");
				cont.setAttribute("border", "1");
				const t = document.createElement("font");
				t.textContent = `Kalenteri (${month}.${year})`;
				t.setAttribute("color", "#ffffff");
				title = t
				cont.appendChild(t);

				const b1 = document.createElement("font");
				b1.setAttribute("color", "#ffffff");
				b1.textContent = "<-  ";
				b1.onclick = (function() {
					month--;
					if (month < 0) {
						month = 11;
						year--;
					}
					reindeer();
				});
				cont.appendChild(b1);
				
				const b2 = document.createElement("font");
				b2.setAttribute("color", "#ffffff");
				b2.textContent = "  ->";
				b2.onclick = (function() {
					month++;
					if (month > 11) {
						month = 0;
						year++;
					}
					reindeer();
				});
				cont.appendChild(b2);
				
				const table = document.createElement("table");
				table.setAttribute("bgcolor", "#ffffff");
				table.setAttribute("bordercolordark", "#000000");
				table.setAttribute("bordercolorlight", "#ffffff");
				table.setAttribute("border", "1");
				table.setAttribute("cellpadding", "5");
				for (let row = 0; row < 7; row++) {
					const rowDiv = document.createElement("tr");
					for (let col = 0; col < 7; col++) {
						const box = (row == 0) ? (() => {
							const b = document.createElement("th");
							b.setAttribute("bgcolor", "#000000");
							b.setAttribute("valign", "center");
							b.setAttribute("align", "center");
							const txt = document.createElement("font");
							txt.textContent = ["ma", "ti", "ke", "to", "pe", "la", "su"][col];
							txt.setAttribute("color", "#ffffff");
							b.appendChild(txt);
							return b;
						})() : (() => {
							const b = document.createElement("td");
							b.id = (col + (row-1)*7)+1;
							b.textContent = (col + (row-1)*7)+1;
							b.onclick = (function(e) {
								if (b.textContent == "") {
									return;
								}
								const day = b.textContent;
								const date = `${year}-${month}-${day}`;
								if (!e.altKey && !e.ctrlKey) {
									holidays.push(date);
									b.setAttribute("bgcolor", "#ff0000");
								} else {
									if (e.altKey) {
										startDate = date;
									}else {
										endDate = date;
									}
									reindeer();
								}
							});
							squares.push(b);
							return b;
						})();
						rowDiv.appendChild(box);
					}
					lastRow = rowDiv;
					table.appendChild(rowDiv);
				}
				cont.appendChild(table);

				shadowRoot.appendChild(cont);
				reindeer();
			}
		}

		customElements.define('calendar-component', Calendar);
		</script>
</html>
